<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SvS Ranking Lookup</title>
<style>
  :root{
    --bg:#0f1420; --card:#181f30; --card2:#1f2840; --text:#e8ecf5; --muted:#8c97b2;
    --accent:#4da3ff; --gold:#f5c542; --silver:#c0c8d8; --bronze:#d08a52; --err:#ff6b6b; --line:#2a3552;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .wrap{max-width:860px;margin:0 auto;padding:32px 16px 60px}
  h1{margin:0 0 4px;font-size:1.7rem}
  .sub{color:var(--muted);margin-bottom:24px;font-size:.95rem}
  form{display:flex;gap:10px}
  input{flex:1;padding:14px 16px;font-size:1.1rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:none}
  input:focus{border-color:var(--accent)}
  button{padding:14px 24px;font-size:1rem;font-weight:600;border:0;border-radius:10px;background:var(--accent);color:#06101f;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  #result{margin-top:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  .rankbox{display:flex;align-items:center;gap:20px;margin-bottom:18px}
  .rank{font-size:3rem;font-weight:800;line-height:1;min-width:110px}
  .rank small{display:block;font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
  .r1{color:var(--gold)} .r2{color:var(--silver)} .r3{color:var(--bronze)}
  .ign{font-size:1.5rem;font-weight:700;word-break:break-word}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat{background:var(--card2);border-radius:10px;padding:12px 14px}
  .stat span{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
  .stat b{font-size:1.1rem}
  .error{background:#3a1d24;border:1px solid #6b2c38;color:var(--err);padding:14px 16px;border-radius:10px}
  h2{margin:36px 0 10px;font-size:1.15rem}
  .tablewrap{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .scroll{max-height:420px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{position:sticky;top:0;background:var(--card2);color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
  td.num,th.num{text-align:right}
  tr:hover td{background:#1c2438}
  tr.hl td{background:#23406b}
  .filter{margin:10px 0}
  .filter input{width:100%;padding:10px 14px;font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>SvS Ranking Lookup</h1>
  <div class="sub">October State vs State Top 200 (10th October UTC 04) &middot; Top 200</div>

  <form id="f">
    <input id="gid" type="text" inputmode="numeric" placeholder="Enter your Game ID" autocomplete="off" autofocus>
    <button type="submit">Search</button>
  </form>

  <div id="result"></div>

  <h2>Full Leaderboard</h2>
  <div class="filter"><input id="filter" type="text" placeholder="Filter by IGN, alliance or Game ID..."></div>
  <div class="tablewrap"><div class="scroll">
    <table>
      <thead><tr><th>Rank</th><th>IGN</th><th>Alliance</th><th>Game ID</th><th>State</th><th class="num">Total Score</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div></div>
</div>

const BY_ID = Object.fromEntries(DATA.players.map(p=>[String(p.game_id),p]));
const fmt = n => Number(n).toLocaleString();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let all = [], highlight = null;

function renderRows(list){
  document.getElementById('rows').innerHTML = list.map(p => `
    <tr class="${p.game_id===highlight?'hl':''}" id="row-${p.game_id}">
      <td>#${p.rank}</td><td>${esc(p.ign)}</td><td>${esc(p.alliance)}</td>
      <td>${p.game_id}</td><td>${p.state}</td><td class="num">${fmt(p.score)}</td>
    </tr>`).join('');
}

all = DATA.players; renderRows(all);

document.getElementById('filter').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  renderRows(!q ? all : all.filter(p =>
    p.ign.toLowerCase().includes(q) || p.alliance.toLowerCase().includes(q) || String(p.game_id).includes(q)));
});

document.getElementById('f').addEventListener('submit', async e=>{
  e.preventDefault();
  const out = document.getElementById('result');
  const gid = document.getElementById('gid').value;
  const id = gid.trim().replace(/[,\s]/g,'');
  let err = null, p = null;
  if(!id) err = 'Please enter a Game ID.';
  else if(!/^\d+$/.test(id)) err = 'Game ID should contain numbers only.';
  else if(!(p = BY_ID[id])) err = 'Game ID ' + id + ' was not found in the Top ' + DATA.players.length + '.';
  if(err){ out.innerHTML = `<div class="error">${esc(err)}</div>`; highlight=null; renderRows(all); return; }
  const cls = p.rank<=3 ? 'r'+p.rank : '';
  out.innerHTML = `
    <div class="card">
      <div class="rankbox">
        <div class="rank ${cls}"><small>Rank</small>#${p.rank}</div>
        <div class="ign">${esc(p.ign)}</div>
      </div>
      <div class="grid">
        <div class="stat"><span>Game ID</span><b>${p.game_id}</b></div>
        <div class="stat"><span>Alliance</span><b>${esc(p.alliance)}</b></div>
        <div class="stat"><span>State</span><b>${p.state}</b></div>
        <div class="stat"><span>Total Score</span><b>${fmt(p.score)}</b></div>
      </div>
    </div>`;
  highlight = p.game_id;
  document.getElementById('filter').value = '';
  renderRows(all);
  const row = document.getElementById('row-'+p.game_id);
  if(row) row.scrollIntoView({block:'center'});
});
